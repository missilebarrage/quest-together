# Packages a tagged version (v1.2.3) and uploads it to CurseForge and GitHub Releases, once the
# tests pass. Needs the repository secret CF_API_KEY and "## X-Curse-Project-ID" in QuestTogether/QuestTogether.toc.
# Tags containing "alpha" or "beta" (v1.2.3-beta1) become alpha or beta files on CurseForge.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to a commit because this step gets the CurseForge token.
      - uses: BigWigsMods/packager@e50a250f8705041e40f2fa1ddcb280a686d65aa0 # v2.6.1
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
